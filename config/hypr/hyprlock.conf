#  ~/.config/hypr/hyprlock.conf

$wallpaper = ~/Pictures/wallpapers/wallpaper.png
$font = MesloLGM Nerd Font Mono

general {
    hide_cursor = true
    grace = 0
    ignore_empty_input = true
}

# fade in when the lock appears, fade out on successful unlock.
# speed is in deciseconds: 8 = 0.8s
animations {
    enabled = true
    bezier = linear, 1, 1, 0, 0
    bezier = easeOut, 0.16, 1, 0.3, 1

    animation = fadeIn, 1, 8, easeOut
    animation = fadeOut, 1, 5, easeOut
    animation = inputFieldDots, 1, 2, linear
}

background {
    monitor =
    path = $wallpaper

    # effective blur is roughly blur_size * blur_passes.
    # keep blur_size under ~8 or the kawase passes start to band.
    blur_passes = 3
    blur_size = 7

    noise = 0.0117
    contrast = 0.90
    brightness = 0.75
    vibrancy = 0.17
    vibrancy_darkness = 0.0
}

label {
    monitor =
    text = cmd[update:1000] date +"%H:%M"
    font_family = $font
    font_size = 90
    color = rgba(224, 217, 209, 1.0)
    position = 0, 160
    halign = center
    valign = center
    shadow_passes = 2
    shadow_size = 4
}

label {
    monitor =
    text = cmd[update:60000] date +"%A, %B %-d"
    font_family = $font
    font_size = 18
    color = rgba(156, 143, 129, 1.0)
    position = 0, 85
    halign = center
    valign = center
    shadow_passes = 2
}

input-field {
    monitor =
    size = 280, 52
    position = 0, -60
    halign = center
    valign = center

    outline_thickness = 2
    rounding = 8
    dots_size = 0.28
    dots_spacing = 0.25
    dots_center = true

    outer_color = rgba(14, 21, 21, 0.75)
    inner_color = rgba(14, 21, 21, 0.75)
    font_color = rgba(224, 217, 209, 1.0)
    check_color = rgba(103, 162, 158, 1.0)
    fail_color = rgba(212, 92, 84, 1.0)

    placeholder_text = <i>password</i>
    fail_text = <i>$FAIL ($ATTEMPTS)</i>
    fade_on_empty = false
    shadow_passes = 2
}
